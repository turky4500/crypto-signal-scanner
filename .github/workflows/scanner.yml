name: 🔍 ماسح إشارات العملات - Crypto Signal Scanner

# ═══════════════════════════════════════════════════════════════════════════════
# ║                         ماسح إشارات العملات المشفرة                         ║
# ║                     Crypto Spot Signal Scanner Workflow                     ║
# ║                                                                          ║
# ║  يُنفّذ هذا الـ Workflow كل ساعة لتحليل أزواج USDT على بينانس         ║
# ║  ويبحث عن إشارات شراء باستخدام التحليل الفني.                            ║
# ║                                                                          ║
# ║  الجدولة: كل ساعة عند الدقيقة 5 (للتزامن مع إغلاق شمعة الـ 1H)         ║
# ╚══════════════════════════════════════════════════════════════════════════════

on:
  # ─────────────────────────────────────────────────────────────────────────────
  # التشغيل المجدول: كل ساعة عند الدقيقة 5
  # ─────────────────────────────────────────────────────────────────────────────
  schedule:
    - cron: '5 * * * *'   # التحديث كل ساعة عند الدقيقة 5

  # ─────────────────────────────────────────────────────────────────────────────
  # التشغيل اليدوي (للمستخدم)
  # ─────────────────────────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      force_run:
        description: 'فرض التشغيل حتى مع وجود أخطاء؟'
        required: false
        default: 'false'
        type: boolean

  # ─────────────────────────────────────────────────────────────────────────────
  # التشغيل عند دفع كود جديد
  # ─────────────────────────────────────────────────────────────────────────────
  push:
    branches:
      - main
      - master
    paths:
      - 'scanner.py'
      - 'requirements.txt'
      - '.github/workflows/scanner.yml'

# ─────────────────────────────────────────────────────────────────────────────
# الأذونات المطلوبة
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write      # للسماح بـ commit و push للملفات
  pages: write         # لكتابة صفحات GitHub
  id-token: write      # للمصادقة

# ─────────────────────────────────────────────────────────────────────────────
# تحديد نوع الجهاز الافتراضي
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: crypto-scanner
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# المهام
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  #                    المهمة الأولى: تشغيل الماسح
  # ═══════════════════════════════════════════════════════════════════════════
  scan:
    name: 🔍 تحليل الإشارات
    runs-on: ubuntu-latest          # استخدام أحدث إصدار من Ubuntu

    steps:
      # ─────────────────────────────────────────────────────────────────────────
      # 1. استنساخ المستودع
      # ─────────────────────────────────────────────────────────────────────────
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # 2. إعداد Python
      # ─────────────────────────────────────────────────────────────────────────
      - name: 🐍 إعداد Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'                 # تخزين مؤقت للحزم

      # ─────────────────────────────────────────────────────────────────────────
      # 3. تثبيت الحزم المطلوبة
      # ─────────────────────────────────────────────────────────────────────────
      - name: 📦 تثبيت الحزم
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─────────────────────────────────────────────────────────────────────────
      # 4. عرض معلومات النظام
      # ─────────────────────────────────────────────────────────────────────────
      - name: ℹ️ عرض معلومات النظام
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🕐 وقت التشغيل: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🐍 إصدار Python: $(python --version)"
          echo "📍 دليل العمل: $(pwd)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ─────────────────────────────────────────────────────────────────────────
      # 5. تشغيل الماسح
      # ─────────────────────────────────────────────────────────────────────────
      - name: 🚀 تشغيل ماسح الإشارات
        id: scanner
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 بدء تشغيل ماسح الإشارات..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          python scanner.py
          SCANNER_EXIT=$?
          echo "exit_code=$SCANNER_EXIT" >> $GITHUB_OUTPUT
          
          if [ $SCANNER_EXIT -eq 0 ]; then
            echo "✅ انتهى الماسح بنجاح!"
          else
            echo "⚠️ انتهى الماسح مع أخطاء!"
          fi

      # ─────────────────────────────────────────────────────────────────────────
      # 6. عرض نتائج المسح
      # ─────────────────────────────────────────────────────────────────────────
      - name: 📊 عرض نتائج المسح
        if: always()
        run: |
          if [ -f signals.json ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 ملخص النتائج:"
            echo "   إجمالي الأزواج المفحوصة: $(cat signals.json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('stats',{}).get('total_scanned','N/A'))")"
            echo "   عدد الإشارات المكتشفة: $(cat signals.json | python -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('signals',[])))")"
            echo "   الاستراتيجية A: $(cat signals.json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('stats',{}).get('strategies',{}).get('A','0'))")"
            echo "   الاستراتيجية B: $(cat signals.json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('stats',{}).get('strategies',{}).get('B','0'))")"
            echo "   الاستراتيجية C: $(cat signals.json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('stats',{}).get('strategies',{}).get('C','0'))")"
            echo "   وقت المسح: $(cat signals.json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('stats',{}).get('scan_duration','N/A'))") ثانية"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "⚠️ ملف signals.json غير موجود!"
          fi

      # ─────────────────────────────────────────────────────────────────────────
      # 7. رفع ملف الإشارات إلى GitHub
      # ─────────────────────────────────────────────────────────────────────────
      - name: 📤 رفع ملف signals.json
        uses: EndBug/add-and-commit@v9
        with:
          add: 'signals.json'
          message: |
            🤖 تحديث تلقائي: إشارات المسح - $(date -u '+%Y-%m-%d %H:%M')
            [إشارات جديدة: $(cat signals.json | python -c "import sys,json; print(len(json.load(sys.stdin).get('signals',[])))" 2>/dev/null || echo "0")]
          author_name: GitHub Actions Bot
          author_email: actions@github.com
          skip_dirty: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  #                 المهمة الثانية: نشر على GitHub Pages
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🌐 نشر على صفحات GitHub
    needs: scan
    runs-on: ubuntu-latest
    if: always()           # يعمل حتى لو فشل المسح (لعرض حالة فارغة)

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ─────────────────────────────────────────────────────────────────────────
      # 1. استنساخ المستودع
      # ─────────────────────────────────────────────────────────────────────────
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ─────────────────────────────────────────────────────────────────────────
      # 2. إعداد Python
      # ─────────────────────────────────────────────────────────────────────────
      - name: 🐍 إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─────────────────────────────────────────────────────────────────────────
      # 3. التحقق من وجود ملف الإشارات
      # ─────────────────────────────────────────────────────────────────────────
      - name: 📄 التحقق من ملف الإشارات
        run: |
          if [ -f signals.json ]; then
            echo "✅ ملف signals.json موجود"
          else
            echo "⚠️ ملف signals.json غير موجود، سيتم إنشاء ملف فارغ"
            echo '{"timestamp":"","stats":{"total_scanned":0,"signals_found":0},"signals":[]}' > signals.json
          fi

      # ─────────────────────────────────────────────────────────────────────────
      # 4. التحقق من وجود ملف index.html
      # ─────────────────────────────────────────────────────────────────────────
      - name: 🌐 التحقق من ملف الواجهة
        run: |
          if [ -f index.html ]; then
            echo "✅ ملف index.html موجود"
          else
            echo "❌ ملف index.html غير موجود!"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────────────
      # 5. رفع المحتوى إلى GitHub Pages
      # ─────────────────────────────────────────────────────────────────────────
      - name: 🚀 رفع إلى GitHub Pages
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 1

      # ─────────────────────────────────────────────────────────────────────────
      # 6. نشر الصفحة
      # ─────────────────────────────────────────────────────────────────────────
      - name: ✅ نشر الصفحة
        uses: actions/dispages@v4

# ═══════════════════════════════════════════════════════════════════════════════
# ملاحظات:
# ─────────────────────────────────────────────────────────────────────────────
# 1. يجب تفعيل GitHub Pages في إعدادات المستودع:
#    Settings → Pages → Source: GitHub Actions
#
# 2. يتم تشغيل المسح كل ساعة عند الدقيقة 5 (بعد إغلاق شمعة الساعة)
#
# 3. يمكن تشغيل المسح يدوياً من تبويب Actions في المستودع
#
# 4. ملف signals.json يتم تحديثه تلقائياً في المستودع
#
# 5. الواجهة (index.html) تقرأ البيانات من signals.json مباشرة
# ═══════════════════════════════════════════════════════════════════════════════
